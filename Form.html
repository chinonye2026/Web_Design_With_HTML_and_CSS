<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Learning HTML Form</title>
</head>
<body>
    <h1>School Registration Form</h1>
    <!--Input for first name-->
    <form action="">
        <label for="firstName">First Name</label>
        <input type="text" placeholder="firstname"> 
    
    <br>
    <!--Input for Last name-->
    
        <label for="lastName">Last Name</label>
        <input type="text" placeholder="last name" required>
    
    <br>
    <!--Input for Email Adress-->
    
        <label for="email">Email Address</label>
        <input type="email">
    
    <br>
    <!--Input for Password-->
    
        <label for="Password">Your Password</label>
        <input type="password">
    
    <br>
    <!--Input for Date of Birth-->
    
        <label for="date">Date of Birth</label>
        <input type="date">
    
    <br>
    <!--Input for Phone-->
    
        <label for="tel">Phone Number</label>
        <input type="tel">
    
    <br> <br>
    <!--Input for Subjects-->
    
        <label for="">Choose Jamb Subject</label>
        <br>
        <input type="checkbox">
        <label for="">Mathematics</label>
        <br>
        <input type="checkbox">
        <label for="">Biology</label>
        <br>
        <input type="checkbox">
        <label for="">English</label>
        <br>
        <input type="checkbox">
        <label for="">Civic Education</label>
        <br>
        <input type="checkbox">
        <label for="">Chemistry</label> 

    <!--Input for Gender-->
    <br> <br>
    
        <label for="">What is your Gender</label>
        <br>
        <input type="radio" name="gender">
        <label for="">Male</label>
        <br>
        <input type="radio" name="gender">
        <label for="">Female</label>
    
    <!--Input for Subjects-->
    <br> 
    
        <label for="">State of Origin</label>
        <br>
        <select name="StateofOrigin" id="">
            <option value="">Choose</option>
            <option value="">Enugu state</option>
            <option value="">Anambra state</option>
            <option value="">Ebonyi state</option>
            <option value="">Abia state</option>
            <option value="">Imo state</option>
        </select>

     <!-- Input for Favorite Color --> <br> <br>
        <label for="">Pick Your Label</label>
        <input type="color">

        <br> <br>
        <input type="submit">

        <!-- Customizable Button -->
    
         <button>login</button>
    </form>  
    
    
     
</body>
</html>
